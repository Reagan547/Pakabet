<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pakabet app icon">
  <defs>
    <linearGradient id="pk-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D3050"/>
      <stop offset="0.55" stop-color="#101A2B"/>
      <stop offset="1" stop-color="#06090F"/>
    </linearGradient>
    <linearGradient id="pk-arc" x1="0.05" y1="0.95" x2="0.95" y2="0.05">
      <stop offset="0" stop-color="#C8102E"/>
      <stop offset="0.52" stop-color="#F2A31B"/>
      <stop offset="1" stop-color="#00A651"/>
    </linearGradient>
    <radialGradient id="pk-halo" cx="0.74" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="pk-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#pk-tile)"/>
  <rect width="512" height="512" rx="118" fill="url(#pk-halo)"/>
  <rect x="5" y="5" width="502" height="502" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="10"/>

  <!-- multiplier climb -->
  <g filter="url(#pk-glow)" opacity="0.55">
    <path d="M84 396 C 196 394 268 352 316 262 C 338 220 350 186 358 160"
          fill="none" stroke="url(#pk-arc)" stroke-width="26" stroke-linecap="round"/>
  </g>
  <path d="M84 396 C 196 394 268 352 316 262 C 338 220 350 186 358 160"
        fill="none" stroke="url(#pk-arc)" stroke-width="30" stroke-linecap="round"/>

  <!-- climbing aviator jet -->
  <g transform="translate(398 112) rotate(42)">
    <path d="M0 -62 C 13 -44 20 -19 21 8 L21 14 62 42 62 60 21 46 19 74 34 88 34 100 0 90 -34 100 -34 88 -19 74 -21 46 -62 60 -62 42 -21 14 -21 8 C -20 -19 -13 -44 0 -62 Z"
          fill="#FFFFFF"/>
    <path d="M0 -46 C 8 -32 12 -14 13 6 L13 44 -13 44 -13 6 C -12 -14 -8 -32 0 -46 Z"
          fill="#D9E3F2"/>
    <circle cx="0" cy="-16" r="8" fill="#101A2B" opacity="0.75"/>
  </g>

  <!-- Kenyan flag base bar -->
  <g>
    <rect x="84" y="428" width="110" height="16" rx="8" fill="#F4F7FC"/>
    <rect x="204" y="428" width="110" height="16" rx="8" fill="#C8102E"/>
    <rect x="324" y="428" width="104" height="16" rx="8" fill="#00A651"/>
  </g>
</svg>
