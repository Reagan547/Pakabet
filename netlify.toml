# Netlify configuration for the Palpesabet Angular front end.
# The site is the static browser build; the API lives separately at
# api.palpesabet.site, which the app calls by absolute URL (see
# src/app/core/config/api-url.ts), so no proxying is needed here.

[build]
  command = "npm ci && npm run build"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "22"

# The retired domain serves the same site, so send it to the canonical one.
# Without this the browser origin stays pakabet.site and the API rejects the
# call, since ALLOWED_ORIGINS now lists only the palpesabet.site origins.
[[redirects]]
  from = "https://pakabet.site/*"
  to = "https://palpesabet.site/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.pakabet.site/*"
  to = "https://palpesabet.site/:splat"
  status = 301
  force = true

# Angular's router owns every path that is not a real file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed bundles are immutable; index.html must never be cached or players
# stay on an old build after every deploy.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
