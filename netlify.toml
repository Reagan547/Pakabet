# Netlify configuration for the Pakabet Angular front end.
# The site is the static browser build; the API lives separately at
# api.pakabet.site, which the app calls by absolute URL (see
# src/app/core/config/api-url.ts), so no proxying is needed here.

[build]
  command = "npm ci && npm run build"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "22"

# Angular's router owns every path that is not a real file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed bundles are immutable; index.html must never be cached or players
# stay on an old build after every deploy.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
